[versions]
agp = "8.12.2"
kotlin = "2.2.10"
composeBom = "2025.08.01"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version = "1.17.0" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version = "2.9.3" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version="1.10.1" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version = "2.8.4" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.6.3" }

#BOM
firebase-bom = { module = "com.google.firebase:firebase-bom", version = "32.1.0" }
firebase-auth = { module = "com.google.firebase:firebase-auth" }

play-services-auth = { module = "com.google.android.gms:play-services-auth", version = "21.2.0" }

splash = { group = "androidx.core", name = "core-splashscreen", version = "1.0.1" }
koin = { group = "io.ktor", name = "ktor-client-android", version = "3.2.3" }
koin-insert = { group = "io.insert-koin", name = "koin-android", version = "4.1.0" }
lottie = { module = "com.airbnb.android:lottie-compose", version = "6.6.7" }
app-update = { module = "com.google.android.play:app-update", version = "2.1.0" }
app-update-ktx = { module = "com.google.android.play:app-update-ktx", version = "2.1.0" }




[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

